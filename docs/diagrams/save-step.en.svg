<svg xmlns="http://www.w3.org/2000/svg" width="760" height="676" viewBox="0 0 760 676" role="img" aria-label="The Save step as a sequence: the test sends do Save, the CLI passes the action to the ViewModel and answers ok, and the test polls ls until isSaved is true. Meanwhile the Task saves through FixtureHTTPClient."><title>The Save step as a sequence: the test sends do Save, the CLI passes the action to the ViewModel and answers ok, and the test polls ls until isSaved is true. Meanwhile the Task saves through FixtureHTTPClient.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}.t{font-size:15px;font-weight:600}.t14{font-size:14px;font-weight:600}.tm{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:14px;font-weight:600}.s{font-size:13px;fill:#59636e}.ns{font-size:12.5px;fill:#59636e}.n{font-size:12.5px}.sm{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#59636e}.xs{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#59636e}.l{font-size:13px;fill:#59636e}.lm{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#59636e}.cap{font-size:12px;font-weight:600;fill:#59636e;letter-spacing:.06em}.dark{fill:#1f2328}.blue{fill:#0969da}.red{fill:#cf222e}.box{fill:#fff;stroke:#8c959f;stroke-width:1.2}.core{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.2}.corebox{fill:#fff;stroke:#54aeff;stroke-width:1.5}.hot{fill:#ffebe9;stroke:#cf222e;stroke-width:2}.focus{fill:#fff;stroke:#1f2328;stroke-width:2.2}.result{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:4 3}.lane{fill:#f6f8fa}.note{fill:#fff8c5;stroke:#d4a72c}.ok{fill:#dafbe1;stroke:#1a7f37}.e{fill:none;stroke:#6e7781;stroke-width:1.5}.d{stroke-dasharray:5 4}.h{stroke:#cf222e;stroke-width:2}.life{stroke:#afb8c1;stroke-width:1.2;stroke-dasharray:4 4}.tip{fill:#6e7781}.tiph{fill:#cf222e}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tip" d="M0,0L10,5L0,10z"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tiph" d="M0,0L10,5L0,10z"/></marker></defs><rect x="0.5" y="0.5" width="759" height="675" rx="12" fill="#fff" stroke="#d0d7de"/><path class="life" d="M95,72L95,660"/><path class="life" d="M285,72L285,660"/><path class="life" d="M475,72L475,660"/><path class="life" d="M665,72L665,660"/><rect class="box" x="5" y="20" width="180" height="52" rx="8"/><text class="t14" x="95.0" y="41.5" text-anchor="middle">test + sdk.mjs</text><text class="s" x="95.0" y="60.5" text-anchor="middle">Node</text><rect class="box" x="195" y="20" width="180" height="52" rx="8"/><text class="t14" x="285.0" y="41.5" text-anchor="middle">inventory-cli</text><text class="xs" x="285.0" y="60.5" text-anchor="middle">IntrospectionSession</text><rect class="corebox" x="385" y="20" width="180" height="52" rx="8"/><text class="t14" x="475.0" y="41.5" text-anchor="middle">Detail ViewModel</text><text class="xs" x="475.0" y="60.5" text-anchor="middle">update(state:message:)</text><rect class="box" x="575" y="20" width="180" height="52" rx="8"/><text class="t14" x="665.0" y="41.5" text-anchor="middle">FixtureHTTPClient</text><text class="xs" x="665.0" y="60.5" text-anchor="middle">fixtures/*.json</text><path class="e" d="M95,104L283,104" marker-end="url(#a)"/><text class="lm" x="190.0" y="96" text-anchor="middle">do Save</text><path class="e" d="M285,144L473,144" marker-end="url(#a)"/><text class="lm" x="380.0" y="136" text-anchor="middle">send(action: .save)</text><rect class="note" x="400.0" y="158" width="150" height="46" rx="6"/><text class="lm dark" x="475" y="177" text-anchor="middle">isSaving = true</text><text class="lm dark" x="475" y="195" text-anchor="middle">Task { api.save }</text><rect class="note" x="200.0" y="216" width="170" height="28" rx="6"/><text class="n" x="285" y="235" text-anchor="middle">NetworkGuard: clean</text><path class="e d" d="M285,270L97,270" marker-end="url(#a)"/><text class="lm" x="190.0" y="262" text-anchor="middle">{&quot;ok&quot;:true}</text><path class="e" d="M95,310L283,310" marker-end="url(#a)"/><text class="lm" x="190.0" y="302" text-anchor="middle">ls</text><path class="e d" d="M285,350L97,350" marker-end="url(#a)"/><text class="lm" x="190.0" y="342" text-anchor="middle">&quot;isSaving&quot;: true</text><rect class="note" x="5.0" y="362" width="180" height="46" rx="6"/><text class="n" x="95" y="381" text-anchor="middle">expectation not met:</text><text class="n" x="95" y="399" text-anchor="middle">ls again in 10 ms</text><path class="e" d="M475,436L663,436" marker-end="url(#a)"/><text class="lm" x="570.0" y="428" text-anchor="middle">PUT /products/1</text><path class="e d" d="M665,476L477,476" marker-end="url(#a)"/><text class="l" x="570.0" y="468" text-anchor="middle">200 from the fixture</text><rect class="note" x="400.0" y="488" width="150" height="46" rx="6"/><text class="lm dark" x="475" y="507" text-anchor="middle">.saved → update</text><text class="lm dark" x="475" y="525" text-anchor="middle">isSaved = true</text><path class="e" d="M95,562L283,562" marker-end="url(#a)"/><text class="lm" x="190.0" y="554" text-anchor="middle">ls</text><path class="e d h" d="M285,602L97,602" marker-end="url(#ah)"/><text class="lm red" x="190.0" y="594" text-anchor="middle">&quot;isSaved&quot;: true</text><rect class="ok" x="5.0" y="614" width="180" height="28" rx="6"/><text class="n" x="95" y="633" text-anchor="middle">expectation met</text></svg>
